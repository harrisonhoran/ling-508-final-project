name: Run Testing Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and start containers
        run: docker compose up -d --build
      - name: Wait for app container to be running
        run: |
          for i in {1..30}; do
            status=$(docker compose ps -q app | xargs docker inspect -f '{{.State.Running}}' 2>/dev/null)
            if [ "$status" = "true" ]; then
              echo "app is running"
              exit 0
            fi
            echo "waiting for app... ($i)"
            sleep 3
          done
          echo "app never came up"
          docker compose logs
          exit 1
      - name: Run tests in container
        run: docker compose exec -T app python -m pytest tests
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== app logs ==="
          docker compose logs app
          echo "=== db logs ==="
          docker compose logs db
          echo "=== system memory ==="
          free -h
          echo "=== dmesg (OOM check) ==="
          dmesg 2>/dev/null | grep -i "killed process" || echo "no OOM kills found in dmesg"
      - name: Tear down containers
        if: always()
        run: docker compose down
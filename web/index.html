<!DOCTYPE html>
<html lang="en">
<head>
    <style>
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    line-height: 1.5;
  }
  h1 { margin-bottom: 4px; }
  h2 { margin-top: 32px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  .input-group {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 14px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    box-sizing: border-box;
  }
  textarea { resize: vertical; }
  .input-group label[for] ~ input[type="radio"] { display: inline; }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  pre {
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
  }
</style>
    <meta charset="UTF-8">
    <title>Podcast Transcript Parser</title>
</head>
<body>

<h1>Transcript Parser</h1>

<h2>Transcript Input</h2>
<form id="form1">
    <div class="input-group">
        <label for="podcast_name">Podcast Name:</label>
        <input id="podcast_name" name="podcast_name" type="text" required/>
    </div>
    <div class="input-group">
        <label for="filename">Filename:</label>
        <input id="filename" name="filename" type="text" required/>
    </div>
    <div class="input-group">
        <label for="title">Title (optional):</label>
        <input id="title" name="title" type="text"/>
    </div>
    <div class="input-group">
        <label for="raw_transcription_text">Raw Transcript (JSON):</label>
        <textarea id="raw_transcription_text" name="raw_transcription_text" rows="6" required></textarea>
    </div>
    <div class="input-group">
        <label>Mode:</label>
        <label><input type="radio" name="mode" value="store_only"> Store Only</label>
        <label><input type="radio" name="mode" value="clean" checked> Clean</label>
    </div>
    <button type="submit">Submit</button>
</form>

<h2>Transcript Output:</h2>
<pre id="response"></pre>

</body>
<script>
async function handleSubmit(event) {
    event.preventDefault();
    const data = new FormData(event.target);
    const value = Object.fromEntries(data.entries());
    const response = await fetch('http://localhost:5000/transcripts', {
        method: 'POST',
        body: JSON.stringify(value),
        headers: {
            'Content-Type': 'application/json',
        }
    });
    const myJson = await response.json();
    document.getElementById('response').textContent = JSON.stringify(myJson, undefined, 2);
}
const form1 = document.getElementById("form1");
form1.addEventListener("submit", async (e) => handleSubmit(e), false);
</script>
</html>
